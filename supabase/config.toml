# Minimal Supabase CLI config. Migrations are generated by drizzle-kit into supabase/migrations
# with timestamp prefixes, so `supabase db push` and `pnpm db:migrate` apply the same files.
project_id = "astrologer-kavita"

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Seeding is done by `pnpm db:seed` (scripts/seed.ts), not by SQL seed files.
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[api]
enabled = true
port = 54321
schemas = ["public"]

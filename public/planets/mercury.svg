<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><style>@media (prefers-reduced-motion:no-preference){.ph{animation:ph 70s ease-in-out infinite alternate}}</style><defs><filter id="rl" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="3" result="n"/>
<feDiffuseLighting in="n" surfaceScale="2.6" diffuseConstant="1.15" lighting-color="#fff" result="lit"><fePointLight x="22" y="16" z="60"/></feDiffuseLighting>
<feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="tex"/>
<feSpecularLighting in="n" surfaceScale="2.6" specularConstant="0.18" specularExponent="10" lighting-color="#fff" result="sp"><fePointLight x="22" y="16" z="60"/></feSpecularLighting>
<feComposite in="sp" in2="SourceGraphic" operator="in" result="spi"/>
<feComposite in="spi" in2="tex" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
</filter><radialGradient id="lb" cx="34%" cy="30%" r="72%"><stop offset=".42" stop-color="#000" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity="0.40"/><stop offset="1" stop-color="#000" stop-opacity="0.88"/></radialGradient>
<radialGradient id="sh" cx="50%" cy="50%" r="50%"><stop offset=".84" stop-color="#05061a" stop-opacity=".9"/><stop offset="1" stop-color="#05061a" stop-opacity="0"/></radialGradient>
<clipPath id="k"><circle cx="32" cy="32" r="20"/></clipPath>
<style>@keyframes ph{from{transform:translateX(-6px)}to{transform:translateX(10px)}}</style></defs>
<g clip-path="url(#k)"><rect x="10" y="10" width="44" height="44" fill="#9a8f80" filter="url(#rl)"/>
<circle cx="32" cy="32" r="20" fill="url(#lb)"/><circle class="ph" cx="62" cy="32" r="26" fill="url(#sh)"/></g></svg>
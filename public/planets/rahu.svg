<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><style>@media (prefers-reduced-motion:no-preference){.c{animation:b 6.5s ease-in-out infinite;transform-origin:32px 32px}.d{animation:d 34s ease-in-out infinite alternate}}</style><defs><filter id="rl" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="21" result="n"/>
<feDiffuseLighting in="n" surfaceScale="1.4" diffuseConstant="1.15" lighting-color="#fff" result="lit"><fePointLight x="22" y="16" z="60"/></feDiffuseLighting>
<feComposite in="lit" in2="SourceGraphic" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="tex"/>
<feSpecularLighting in="n" surfaceScale="1.4" specularConstant="0.1" specularExponent="8" lighting-color="#fff" result="sp"><fePointLight x="22" y="16" z="60"/></feSpecularLighting>
<feComposite in="sp" in2="SourceGraphic" operator="in" result="spi"/>
<feComposite in="spi" in2="tex" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
</filter>
<radialGradient id="cor"><stop offset=".62" stop-color="#b79cff" stop-opacity="0"/><stop offset=".78" stop-color="#b79cff" stop-opacity=".7"/><stop offset="1" stop-color="#7a5cf0" stop-opacity="0"/></radialGradient>
<filter id="bl"><feGaussianBlur stdDeviation="1.6"/></filter><clipPath id="k"><circle cx="32" cy="32" r="19"/></clipPath>
<style>@keyframes b{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.1)}}@keyframes d{from{transform:translate(-2px,-1px)}to{transform:translate(2px,1px)}}</style></defs>
<circle class="c" cx="32" cy="32" r="30" fill="url(#cor)" filter="url(#bl)"/>
<g clip-path="url(#k)"><rect class="d" x="10" y="10" width="44" height="44" fill="#221a45" filter="url(#rl)"/><circle cx="32" cy="32" r="19" fill="#05040f" opacity=".55"/></g>
<circle cx="32" cy="32" r="19" fill="none" stroke="#d9c8ff" stroke-opacity=".85" stroke-width="1.1"/>
<path d="M14.5 27a19 19 0 0 1 24-12" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" stroke-linecap="round"/></svg>